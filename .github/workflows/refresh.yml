name: Refresh SBA loan data

on:
  schedule:
    - cron: "17 13 5 * *"   # 5th of every month, 13:17 UTC
  workflow_dispatch: {}      # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull SBA data and rebuild if there's a new quarter
        run: python scripts/pipeline.py
      - name: Pull Overture business listings (all businesses, with or without SBA loans)
        run: python scripts/places.py
      - name: Commit updated data
        run: |
          git config user.name "kc-sba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
